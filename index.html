<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpoTv Labs</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1>🌟 SpoTv Play 🌟</h1>
        <nav class="tabs">
            <button class="tab-btn active" data-tab="now">Now</button>
            <button class="tab-btn" data-tab="golf">Golf</button>
            <button class="tab-btn" data-tab="spozone">Spozone</button>
        </nav>
    </header>

    <main class="app-content">
        <section id="now" class="tab-panel active">
            <div class="session-card">
                <h2>🚀 DeepLink Session</h2>
                
                <div class="control-group">
                    <label>서버 선택:</label>
                    <div class="radio-group">
                        <label class="radio-btn">
                            <input type="radio" name="server" value="staging4" checked>
                            <span class="custom-radio">Staging4</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="server" value="product">
                            <span class="custom-radio">Product</span>
                        </label>
                    </div>
                </div>

                <button id="btn-fetch-games" class="action-btn bouncy">🎮 게임타입 불러오기</button>
                
                <div id="loading" class="hidden">불러오는 중... ⏳</div>
                <div id="error-message" class="hidden error"></div>

                <ul id="game-list" class="game-list"></ul>
                
                <div id="deeplink-panel" class="hidden deeplink-panel">
                    <h3>생성된 딥링크 🔗</h3>
                    <div class="deeplink-url-box">
                        <code id="deeplink-url"></code>
                    </div>
                    <a id="btn-execute-deeplink" href="#" target="_blank" class="action-btn execute-btn">🏃 딥링크 실행하기</a>
                </div>
            </div>
        </section>

        <section id="golf" class="tab-panel">
            <div class="empty-state">
                <h2>⛳️ Golf</h2>
                <p>곧 추가될 기능이에요!</p>
            </div>
        </section>

        <section id="spozone" class="tab-panel">
            <div class="empty-state">
                <h2>⚾️ Spozone</h2>
                <p>아직 텅 비어있어요!</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
